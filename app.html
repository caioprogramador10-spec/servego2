<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#070706" media="(prefers-color-scheme: dark)">
  <meta name="description" content="ServeGo — o profissional que você precisa, quando precisa.">
  <title>ServeGo</title>

  <!-- Tema aplicado antes da primeira pintura (evita flash de tela branca) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("servego.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ServeGo">
  <meta name="application-name" content="ServeGo">
  <meta name="format-detection" content="telephone=no">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/flow.css">
  <link rel="stylesheet" href="css/identity.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/admin-control.css">
</head>
<body>
  <div id="root">
    <div style="min-height:100dvh;display:grid;place-items:center">
      <div style="width:34px;height:34px;border:3px solid rgba(255,255,255,.14);border-top-color:#ffc31a;border-radius:50%;animation:sg-spin .7s linear infinite"></div>
    </div>
  </div>

  <!-- SDK do Supabase (UMD). Sem credenciais em config.js, o app roda em modo demo. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <!-- Núcleo -->
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/api.js"></script>
  <script src="js/api-admin.js"></script>
  <script src="js/router.js"></script>
  <!-- Shell (define SG.app antes das telas, que o referenciam no carregamento) -->
  <script src="js/app.js"></script>

  <!-- Telas -->
  <script src="js/views/identity.js"></script>
  <script src="js/views/auth.js"></script>
  <script src="js/views/client.js"></script>
  <script src="js/views/request-flow.js"></script>
  <script src="js/views/professional-profile.js"></script>
  <script src="js/views/chat.js"></script>
  <script src="js/views/pro.js"></script>
  <script src="js/views/admin.js"></script>
  <script src="js/views/admin-control.js"></script>
  <script src="js/views/profile.js"></script>

  <!-- Bootstrap -->
  <script>
    document.addEventListener("DOMContentLoaded", function () { window.SG.app.start(); });
  </script>
  <script>
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
      window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
    }
  </script>
</body>
</html>
